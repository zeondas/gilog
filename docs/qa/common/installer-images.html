<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:Pretendard;src:url(fonts/PretendardVariable.woff2) format("woff2-variations");font-weight:45 920}
body{margin:0;font-family:Pretendard}
#side{width:164px;height:314px;background:linear-gradient(170deg,#5B45D6 0%,#4B37C4 45%,#3A2A9E 100%);position:relative;overflow:hidden}
#side .ic{position:absolute;left:32px;top:46px;width:100px;height:100px}

#head .nm2{position:absolute;right:58px;top:13px;font-size:24px;font-weight:800;color:#4B37C4;letter-spacing:.03em}

<div id="side"><div class="sq"></div><img class="ic" src="app-icon.svg"><div class="nm">기록</div><div class="t">업무 기록 · 민원 · 일정</div></div>

</body></html>
