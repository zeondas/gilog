[package]
name = "gilog"
version = "0.3.0"
description = "giLog"
edition = "2021"

[lib]
name = "gilog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gilog-core = { path = "core" }
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["windows-native"] }
