[package]
name = "gilog"
version = "0.5.1"
description = "giLog"
edition = "2021"

[lib]
name = "gilog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gilog-core = { path = "core" }
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["windows-native"] }

# 입력 칸에 들어갈 때 한글 입력기를 한글 상태로 바꾸는 데 써요.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Input_Ime", "Win32_UI_WindowsAndMessaging"] }
