<!doctype html>
<!--
  기록 설치·제거 창 그림 원본(2026-10-25 공통 ✔6 – 캔버스 판 Installer.dc.html 3안 연보라 띠 · 로그인 화면 구성: 설치는 앱 아이콘 64 + ㄱILOG 23, 제거는 앱 아이콘만).
  make.py가 이 파일을 100·125·150·175·200% 배율로 찍어 ../*.bmp를 만들어요. 글자·간격을 바꾸면 여기만 고치고 다시 만들어요.

-->
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:Pretendard;src:url(PretendardVariable.woff2) format("woff2-variations");font-weight:45 920}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,sans-serif;color:#1C1B22;background:#fff}
.shot{position:relative;width:520px;height:400px;background:#FFFFFF;overflow:hidden;margin-bottom:10px}
.band{position:absolute;left:0;right:0;top:0;background:#F1EEFF;display:flex;flex-direction:column;align-items:center;justify-content:center}
.band .nm{font-size:22px;line-height:28px;font-weight:800;color:#FFFFFF;letter-spacing:.04em}
.t{position:absolute;left:0;right:0;text-align:center}
.btn{display:flex;align-items:center;justify-content:center;height:34px;padding:0 16px;border-radius:8px;border:1px solid #CFCDD9;background:#FFFFFF;font-size:13px;font-weight:600;color:#1C1B22;white-space:nowrap}
.wrapb{display:inline-block;background:#fff;padding:0;margin:4px}
.p{background:#4B37C4;border-color:#4B37C4;color:#FFFFFF}
.r{background:#8A1F2B;border-color:#8A1F2B;color:#FFFFFF}
</style></head><body>
