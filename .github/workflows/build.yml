# main에 코드가 올라올 때마다 윈도우 설치 파일을 만들어 Releases에 올려요.
# 2026-10-29 검사 자동화(품질 보완 ③ ✔5): 설치 파일을 만들기 전에 규칙·부품 시험(npm test),
# 릴리스 제목에 앱 버전("기록 0.56.0 (build-76)", 태그는 build-N 그대로), 바깥 액션은 커밋 번호로 고정,
# 직접 실행의 "시험 모드"(처음 값 꺼짐 – main에서 직접 돌리면 지금처럼 Releases에 올라가요)는 Releases에 올리지 않고
# 설치 파일을 실행 결과(Artifacts)에만 남겨요. main이 아닌 가지에서 돌리면 늘 시험 모드예요.
name: 윈도우 설치 파일 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 시험 모드 – Releases에 올리지 않아요
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable(2026-10-29)

      # 암호화 저장(SQLCipher)에 들어가는 OpenSSL을 만들 때 필요해요.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      # 저장·암호화 시험(src-tauri/core)은 따로 떨어진 프로젝트라 캐시에 함께 넣어요(빠지면 시험 단계만 20분 넘게 걸려요).
      # check.yml(검사만)과 같은 이름표로 캐시를 나눠 써요(2026-10-20 정리 세션).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: gilog-win
          workspaces: |
            src-tauri
            src-tauri/core
            src-tauri/fastfind

      - run: npm ci

      # 규칙 함수·화면 부품 시험(check.yml과 같은 것, 20초 안쪽) – 실패하면 설치 파일을 만들지 않아요.
      - name: 규칙·부품 시험
        shell: bash
        run: npm test 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      # 릴리스 제목에 넣을 앱 버전(package.json)
      - name: 앱 버전 읽기
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 저장·암호화 시험
        run: cargo test --manifest-path src-tauri/core/Cargo.toml

      # 탐색기 빠른 찾기 도우미(gilog-search.exe, 2026-10-20)를 먼저 만들어 설치 파일에 넣어요(tauri.windows.conf.json의 resources).
      - name: 빠른 찾기 도우미 만들기
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/fastfind/Cargo.toml
          cargo build --release --manifest-path src-tauri/fastfind/Cargo.toml
          mkdir -p src-tauri/bin
          cp src-tauri/fastfind/target/release/gilog-search.exe src-tauri/bin/

      # 설치·제거 창 그림(2026-10-25 공통 ✔6): 저장소엔 PNG만 두고, NSIS가 읽는 BMP(24비트)로 여기서 바꿔요.
      # 원본·만드는 법은 src-tauri/windows/installer/src(assets.html·make.py), 창 꾸미기는 src-tauri/windows/gilog-ui.nsh.
      - name: 설치 창 그림 BMP로
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $n = 0
          Get-ChildItem src-tauri/windows/installer/*.png | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName)
            $bmp = New-Object System.Drawing.Bitmap($img.Width, $img.Height, [System.Drawing.Imaging.PixelFormat]::Format24bppRgb)
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.DrawImage($img, 0, 0, $img.Width, $img.Height); $g.Dispose()
            $bmp.Save([System.IO.Path]::ChangeExtension($_.FullName, '.bmp'), [System.Drawing.Imaging.ImageFormat]::Bmp)
            $bmp.Dispose(); $img.Dispose(); $n++
          }
          if ($n -lt 40) { throw "설치 창 그림이 모자라요: $n" }
          Write-Host "설치 창 그림 $n장"

      # bash 칸에서는 Git에 딸린 perl이 먼저 잡히는데, 2026-10 러너부터 OpenSSL 설정에 필요한 모듈이 빠져 실패해요.
      # 그래서 윈도우용 Strawberry Perl을 쓰게 해요(openssl-src는 PERL 값을 먼저 봐요).
      - name: 설치 파일 만들기
        id: build
        shell: bash
        env:
          PERL: C:\Strawberry\perl\bin\perl.exe
          # 구글 연동 앱 정보(구글 콘솔에서 받은 client_secret JSON 그대로)를 설치 파일에 넣어요. 저장소에는 없어요.
          # 비밀 값이 없으면 비어 있고, 그때는 설정에서 파일을 골라요.
          VITE_GOOGLE_CLIENT: ${{ secrets.GILOG_GOOGLE_CLIENT }}
        run: |
          export PATH="/c/Strawberry/perl/bin:$PATH"
          npm run tauri build 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # 실패하면 오류 줄을 커밋 댓글로 남겨요. (이 작업 공간에서 실행 로그를 직접 못 읽어서예요)
      - name: 실패 내용 남기기
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '빌드 실패 로그 (오류 부분)'; echo '```'; grep -nE "error(\[|:)|Error|npm ERR|panicked|failed" build.log | head -80; echo '---- 끝부분 ----'; tail -60 build.log; echo '```'; } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(cat body.md)" >/dev/null || true

      # 시험 모드(또는 main이 아닌 가지)는 Releases 대신 실행 결과에만 남겨요(3일).
      - name: 설치 파일 남기기(시험 모드)
        if: github.ref != 'refs/heads/main' || inputs.dry_run == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: giLog-${{ steps.ver.outputs.v }}-test
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 3

      - name: 설치 파일 올리기
        if: github.ref == 'refs/heads/main' && inputs.dry_run != true
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: build-${{ github.run_number }}
          name: 기록 ${{ steps.ver.outputs.v }} (build-${{ github.run_number }})
          body: 아래 Assets에서 setup.exe 파일을 내려받아 실행하면 설치돼요.
          files: src-tauri/target/release/bundle/nsis/*.exe
