# wip/* 가지에 올릴 때마다 윈도우에서 "검사만" 해요(2026-10-20 사용자 결정 — 공통 결정 로그 21:18).
# 설치 파일·Releases는 만들지 않아요. 기능 세션은 이 검사가 통과한 뒤 현황판을 "끝"으로 바꿔요.
# 2026-10-27 검사 속도(공통 결정 로그 09:26 ①): 문서·매뉴얼만 바뀐 push는 검사 안 함, 같은 가지에 다시 올리면 앞 검사 취소,
# main과 견줘 src-tauri/**·Cargo.* 가 안 바뀌었으면 Rust 단계를 건너뛰어요(직접 실행은 늘 전부). build.yml은 그대로 전부 돌아요.
# 2026-10-29 검사 자동화(품질 보완 ③ ✔1): 모양 지킴이(사진·계산 모양·동작)를 리눅스 4갈래로 윈도우 검사와 동시에 돌려요.
# 화면 쪽(src/·tools/guard/ 등)을 안 바꾼 가지는 지킴이를 건너뛰어요. 바깥 액션은 커밋 번호로 고정(✔5).
# 2026-10-29 경로 검사 보강(품질 보완 ②-2 ✔4): 윈도우 검사에 앱 쪽 Rust 시험(경로 검사·민원처리·설정)을 더하고,
# 쓰기 권한(커밋 댓글)은 윈도우 검사와 지킴이 결과 댓글 job만 가져요 – 지킴이 4갈래는 읽기만.
name: 검사만 하기

on:
  push:
    branches: ['wip/**']
    paths-ignore:
      - 'docs/**'
      - 'tools/manual/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    # 실패하면 커밋 댓글을 써요
    permissions:
      contents: write
    steps:
      # main과 견주려고 모든 기록을 받아요(갈림점을 찾아야 해요).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # 이 가지가 main에서 갈라진 뒤 Rust 쪽(src-tauri/**·Cargo.*)을 바꿨는지 봐요. 직접 실행이면 늘 전부 돌려요.
      - name: Rust 바뀜 확인
        id: rust
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "직접 실행 – Rust 단계 모두 돌려요"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base=$(git merge-base origin/main HEAD 2>/dev/null || true)
          if [ -z "$base" ]; then
            echo "main과 갈림점을 못 찾음 – Rust 단계 모두 돌려요"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD | grep -E '^src-tauri/|(^|/)Cargo\.[^/]*$' || true)
          if [ -n "$changed" ]; then
            echo "Rust 쪽 바뀐 파일:"; echo "$changed" | head -20; echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Rust 쪽 바뀐 파일 없음 – Rust 단계 건너뛰어요"; echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable(2026-10-29)
        if: steps.rust.outputs.run == 'true'

      # 암호화 저장(SQLCipher)에 들어가는 OpenSSL을 만들 때 필요해요.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: steps.rust.outputs.run == 'true'

      # build.yml과 같은 이름표(shared-key)로 캐시를 나눠 써요. wip 가지는 main이 남긴 캐시를 받아 써요.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.rust.outputs.run == 'true'
        with:
          shared-key: gilog-win
          workspaces: |
            src-tauri
            src-tauri/core
            src-tauri/fastfind

      # bash 칸에서는 Git에 딸린 perl이 먼저 잡혀 OpenSSL 만들기가 실패해요(build.yml과 같은 이유) — Strawberry Perl을 앞에 둬요.
      - name: Perl 길 맞추기
        if: steps.rust.outputs.run == 'true'
        shell: bash
        run: |
          echo 'C:\Strawberry\perl\bin' >> "$GITHUB_PATH"
          echo 'PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"

      - run: npm ci

      - name: 화면 만들기(글자 검사 포함)
        shell: bash
        run: npm run build 2>&1 | tee -a check.log; exit ${PIPESTATUS[0]}

      # 규칙 함수 시험(2026-10-26 정리 2차 – 날짜·전화·머릿기호·민원·할 일·캘린더·예산현황·탐색기·키, vitest 1분 안쪽).
      - name: 규칙 함수 시험
        shell: bash
        run: npm test 2>&1 | tee -a check.log; exit ${PIPESTATUS[0]}

      # 암호 풀기(argon2)는 시험 모드에서 아주 느려서 그 둘만 빠르게 만들어요(시험 결과는 같아요).
      # 만들기와 돌리기를 나눠 두면 어디서 시간이 드는지 단계 시간으로 보여요.
      - name: 저장·암호화 시험 만들기
        if: steps.rust.outputs.run == 'true'
        shell: bash
        run: cargo test --no-run --manifest-path src-tauri/core/Cargo.toml $CORE_FAST 2>&1 | tee -a check.log; exit ${PIPESTATUS[0]}
        env:
          CORE_FAST: --config profile.dev.package.argon2.opt-level=3 --config profile.dev.package.blake2.opt-level=3

      - name: 저장·암호화 시험
        if: steps.rust.outputs.run == 'true'
        shell: bash
        run: cargo test --manifest-path src-tauri/core/Cargo.toml $CORE_FAST 2>&1 | tee -a check.log; exit ${PIPESTATUS[0]}
        env:
          CORE_FAST: --config profile.dev.package.argon2.opt-level=3 --config profile.dev.package.blake2.opt-level=3

      # 앱 틀 검사. 빠른 찾기 도우미 exe는 설치 파일 단계에서만 만들어서, 검사 때는 빈 자리 파일을 둬요(없으면 tauri가 멈춰요).
      # --release는 build.yml이 남긴 캐시(OpenSSL 등 미리 만든 것)를 그대로 쓰려고 붙여요.
      - name: 앱 틀 검사
        if: steps.rust.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p src-tauri/bin && touch src-tauri/bin/gilog-search.exe
          cargo check --release --manifest-path src-tauri/Cargo.toml 2>&1 | tee -a check.log; exit ${PIPESTATUS[0]}

      # 앱 쪽 시험(경로 검사 guard·민원처리 process·설정 prefs 등). 윈도우 전용 시험은 여기서만 돌아요(리눅스는 cfg로 빠짐).
      # 앱 틀 검사와 같은 --release로 build.yml 캐시를 그대로 써요.
      - name: 앱 시험(경로 검사·민원처리·설정)
        if: steps.rust.outputs.run == 'true'
        shell: bash
        run: cargo test --release --manifest-path src-tauri/Cargo.toml 2>&1 | tee -a check.log; exit ${PIPESTATUS[0]}

      - name: 빠른 찾기 도우미 검사
        if: steps.rust.outputs.run == 'true'
        shell: bash
        run: cargo check --manifest-path src-tauri/fastfind/Cargo.toml 2>&1 | tee -a check.log; exit ${PIPESTATUS[0]}

      # 실패하면 오류 줄을 커밋 댓글로 남겨요(build.yml과 같은 방식).
      - name: 실패 내용 남기기
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch check.log
          { echo '검사 실패 로그 (오류 부분)'; echo '```'; grep -nE "error(\[|:)|Error|npm ERR|panicked|failed|FAILED" check.log | head -80; echo '---- 끝부분 ----'; tail -60 check.log; echo '```'; } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(cat body.md)" >/dev/null || true

  # ---------- 미리 보기 저장 모듈(2026-10-29 품질 보완 ②-3 ✔1 → 10-30 2차 ✔2·✔4) ----------
  # src-tauri/core-wasm: 앱 명령 이름 → core 함수 짝 표. 맞춤 시험(앱 명령 목록 = 브라우저용 + 자리 표시자)을 돌리고
  # 브라우저용(wasm32)으로 만들어 산출물(src/wasm-pkg)을 남겨요 – 작업 공간에서 Rust 받기가 막히면 이것을 받아 써요(7일).
  # 윈도우 앱에는 들어가지 않아요. Rust 쪽을 안 바꾼 가지는 건너뛰어요.
  core-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Rust 바뀜 확인
        id: rust
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base=$(git merge-base origin/main HEAD 2>/dev/null || true)
          if [ -z "$base" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$base" HEAD | grep -E '^src-tauri/|^tools/preview/|^\.github/actions/preview-wasm/|(^|/)Cargo\.[^/]*$' || true)
          if [ -n "$changed" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "Rust 쪽 바뀐 파일 없음 – 건너뛰어요"; echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: ./.github/actions/preview-wasm
        if: steps.rust.outputs.run == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.rust.outputs.run == 'true'
        with:
          node-version: 22

      # 앱 명령을 더했는데 미리 보기 목록(브라우저용·자리 표시자)에 안 적으면 여기서 실패해요.
      - name: 명령 맞춤 시험
        if: steps.rust.outputs.run == 'true'
        run: cargo test --manifest-path src-tauri/core-wasm/Cargo.toml --config profile.dev.package.argon2.opt-level=3 --config profile.dev.package.blake2.opt-level=3

      # sqlite-wasm-rs가 SQLite(C)를 브라우저용으로 만들 때 clang을 써요(ubuntu에 들어 있어요).
      - name: 미리 보기 저장 모듈 빌드
        if: steps.rust.outputs.run == 'true'
        run: npm run build:wasm

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.rust.outputs.run == 'true'
        with:
          name: preview-wasm
          path: src/wasm-pkg/
          retention-days: 7

  # ---------- 모양 지킴이(2026-10-29 검사 자동화 ✔1, tools/guard/README.md) ----------
  # main과 갈라진 곳(기준)과 이 가지를 같은 러너에서 빌드해 장면 96개를 4갈래로 나눠 견줘요(기준 사진을 저장소에 두지 않아요).
  # 일부러 바꾼 장면은 커밋 메시지에 "guard-allow: 장면 …" 줄을 적어요(ci.py 설명).
  guard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: 모양 지킴이 ${{ matrix.shard }}
    # 읽기만 – 실패 요약 댓글은 아래 guard-report가 써요(②-2 ✔4)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # 기준 = main과 갈라진 곳. 화면 쪽을 안 바꿨으면 건너뛰어요(직접 실행은 늘 돌려요).
      - name: 화면 바뀜 확인
        id: ui
        shell: bash
        run: |
          base=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "직접 실행 – 지킴이 돌려요"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 미리 보기는 저장 규칙(core)도 실제 것을 써서(②-3 2차) core·core-wasm·tools/preview가 바뀌어도 돌려요.
          changed=$(git diff --name-only "$base" HEAD | grep -E '^(src/|tools/guard/|tools/preview/|src-tauri/core/|src-tauri/core-wasm/|\.github/actions/preview-wasm/|public/|index\.html$|vite\.config\.ts$|tsconfig\.json$|package(-lock)?\.json$)' | grep -vE '\.test\.tsx?$' || true)
          if [ -n "$changed" ]; then
            echo "화면 쪽 바뀐 파일:"; echo "$changed" | head -20; echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "화면 쪽 바뀐 파일 없음 – 지킴이 건너뛰어요"; echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.ui.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.ui.outputs.run == 'true'
        with:
          python-version: '3.13'

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.ui.outputs.run == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium

      - name: 찍는 도구 준비(Playwright·Chromium)
        if: steps.ui.outputs.run == 'true'
        run: |
          pip install playwright==1.63.0 pillow==12.3.0
          python -m playwright install --with-deps chromium

      # 미리 보기 저장 모듈(브라우저용 core)을 만들 Rust·wasm-bindgen(②-3 ✔4)
      - uses: ./.github/actions/preview-wasm
        if: steps.ui.outputs.run == 'true'

      - name: 기준·이 가지 빌드
        if: steps.ui.outputs.run == 'true'
        shell: bash
        run: |
          npm ci
          git worktree add ../base "${{ steps.ui.outputs.base }}"
          # 기준에 지킴이 폴더가 없으면(0.29.0 이전) 이 가지 것을 넣어요(README "지킬 것").
          [ -f ../base/tools/guard/vite.config.ts ] || { mkdir -p ../base/tools; cp -r tools/guard tools/preview ../base/tools/; }
          if cmp -s package-lock.json ../base/package-lock.json; then ln -s "$PWD/node_modules" ../base/node_modules; else (cd ../base && npm ci); fi
          # 기준이 이미 미리 보기 저장 모듈을 쓰면(②-3 2차 뒤) 기준 것도 만들어요 – 그 전 기준은 흉내라 필요 없어요.
          if [ -f ../base/tools/preview/build-wasm.mjs ] && [ -d ../base/src-tauri/core-wasm ]; then (cd ../base && npm run build:wasm); fi
          (cd ../base && npx vite build -c tools/guard/vite.config.ts --outDir /tmp/g_base)
          npm run build:wasm
          npx vite build -c tools/guard/vite.config.ts --outDir /tmp/g_cur

      - name: 사진·계산 모양·동작
        if: steps.ui.outputs.run == 'true'
        run: python3 tools/guard/ci.py /tmp/g_base /tmp/g_cur /tmp/guard --shard ${{ matrix.shard }}/4 --base-tree ../base --base-ref ${{ steps.ui.outputs.base }}

      - name: 실패 요약 준비
        if: failure() && steps.ui.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p /tmp/guard
          [ -f /tmp/guard/report.md ] || echo "모양 지킴이 ${{ matrix.shard }}갈래 – 준비 단계에서 멈췄어요" > /tmp/guard/report.md

      - name: 다른 장면 그림 남기기
        if: failure() && steps.ui.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guard-${{ matrix.shard }}
          path: |
            /tmp/guard/report.md
            /tmp/guard/*.log
            /tmp/guard/diff/
          retention-days: 7

  # 지킴이가 실패하면 갈래마다 남긴 요약(report.md)을 받아 커밋 댓글로 남겨요(윈도우 검사와 같은 방식 – 작업 공간에서 실행 로그를 못 읽어서예요).
  # 쓰기 권한은 이 job만 가져요(②-2 ✔4). 바깥 액션 없이 gh로 받아요.
  guard-report:
    needs: guard
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: 실패 내용 남기기
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p got && cd got
          gh run download ${{ github.run_id }} -R ${{ github.repository }} -p 'guard-*' || true
          found=0
          for r in guard-*/report.md; do
            [ -f "$r" ] || continue
            found=1
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(cat "$r")" >/dev/null || true
          done
          [ "$found" = 1 ] || gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="모양 지킴이 실패 – 요약 파일을 못 받았어요(실행 기록 확인 필요)" >/dev/null || true
