# 미리 보기 저장 모듈(src-tauri/core-wasm → src/wasm-pkg) 빌드 준비(2026-10-30 품질 보완 ②-3 ✔4).
# Rust(wasm32 대상)·만든 것 저장(cache)·wasm-bindgen CLI(판 고정)를 준비해요. 빌드는 부르는 쪽이 `npm run build:wasm`으로 해요.
# CARGO_TARGET_DIR을 이 checkout의 src-tauri/core-wasm/target 하나로 두어 기준(main)·이 가지 빌드가 같은 저장을 나눠 써요.
# 윈도우 설치 파일(build.yml)에는 쓰지 않아요.
name: 미리 보기 저장 모듈 준비
description: wasm32 Rust · cache · wasm-bindgen CLI

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable(2026-10-29)
      with:
        targets: wasm32-unknown-unknown

    # 판은 src-tauri/core-wasm/Cargo.toml·tools/preview/build-wasm.mjs와 같게
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: bindgen
      with:
        path: ~/.cargo/bin/wasm-bindgen
        key: wasm-bindgen-cli-0.2.129-${{ runner.os }}

    - name: wasm-bindgen CLI
      if: steps.bindgen.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

    - name: 저장 위치
      shell: bash
      run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/src-tauri/core-wasm/target" >> "$GITHUB_ENV"

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: gilog-preview-wasm
        workspaces: src-tauri/core-wasm
